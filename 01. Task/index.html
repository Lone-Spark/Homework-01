<!--01. Как браузер получает страницу из интернета?
1. Опишите путь от ввода адреса до показа страницы в 6-8 шагов
Браузер получает страницу из интернета через несколько шагов:
1. Пользователь вводит URL (к примеру https://ru.wikipedia.org/wiki/Википедия) в адресной строке браузера.
2. Браузер отправляет запрос к DNS-серверу, чтобы получить IP-адрес на котором находится веб-страница.
3. Браузер устанавливает соединение с сервером по протоколу HTTP или HTTPS (преимущественно сейчас используется HTTPS так как он более безопасен).
4. Браузер отправляет HTTP-запрос на сервер запрашивая конкретную страницу.
5. (Если статус запроса 200) сервер обрабатывает запрос и отправляет обратно ответ  который содержит HTML-код страницы, а также другие ресурсы (CSS, JavaScript, изображения и т.д.).
6. Браузер получает HTML-код и начинает его разбор (парсинг). Он строит DOM-дерево, применяет стили из CSS и выполняет JavaScript-код. После этого браузер отображает страницу пользователю.

    JavaScript пример: Отвечает за воспроизведение видео 
    <script type="text/javascript">
  $(document).ready(function() {
	function createOrUpdateIframe(src) {
		var $iframe = $('.js-player-container iframe');
		if ($iframe.length === 0) {
			$iframe = $('<iframe>', {
				frameborder: 0,
				allowfullscreen: true,
				allow: 'allowfullscreen, accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture',
				width: '100%',
				height: '100%'
			});
			$('.js-player-container').empty().append($iframe);
		}
		$iframe.attr('src', src);
	}

	$('.ply, .playBtn2, .choose').on('click', function() {
		var firstTabSrc = $('.js-player-tabs li[data-provider="0"]').data('src');
		createOrUpdateIframe(firstTabSrc);
	});

	$('.js-player-tabs li').on('click', function() {
		var tabSrc = $(this).data('src');
		createOrUpdateIframe(tabSrc);
	});
});
</script>
