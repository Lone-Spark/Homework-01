<!-- 02. Каркас HTML документа -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шумерская цивилизация</title>
</head>
<body>
    <div>
        <h1>Шумерская цивилизация</h1>
        <p>Шумерская цивилизация — одна из древнейших цивилизаций, возникшая в <b>Месопотамии</b> <em>(современный Ирак)</em> около 3500 года до н.э.</p>
    </div>
</body>
</html>

<!-- 3. 
 <!DOCTYPE html> объявляет тип документа и версию HTML, используемую в документе. В данном случае это HTML5.
 <head> содержит метаданные о документе, такие как кодировка, настройки viewport и заголовок страницы.
 </body> содержит видимое содержимое веб-страницы, включая заголовки и параграфы.
 <h1> используется для основного заголовка страницы, а <p> для абзацев текста.
 <b> и <em> используются для выделения текста жирным шрифтом и курсивом.
-->
